modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/brnbrd/CollectorsReap/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/collectors-reap"
updateJSONURL="https://raw.githubusercontent.com/brnbrd/CollectorsReap/1.20.1/update.json"
logoFile="collectorsreap.png"
logoBlur=false
credits="reNIK03, brdbrn, vectorwing"
authors="${mod_authors}"
description='''${mod_description}'''
itemIcon="collectorsreap:lime_slice"
configBackground="collectorsreap:textures/block/urchin_test_bricks.png"
[modproperties.collectorsreap]
	configuredBackground="collectorsreap:textures/block/urchin_test_bricks.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="farmersdelight"
type="required"
versionRange="[1.3.3,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="blueprint"
mandatory=true
versionRange="[7.1.3,)"
ordering="AFTER"
side="BOTH"
